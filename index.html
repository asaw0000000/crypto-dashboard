<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16120f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="盯盤喵">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>盯盤喵 · Crypto Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* ================= tokens (JS overrides these) ================= */
:root{
  --accent:#4f8cff;
  --up:#34d399; --down:#f87171;
  --blur:22px; --alpha:.09; --radius:22px;
  --rad-sm:calc(var(--radius)*.6);
}
html[data-theme=dark]{
  --text:#f4f1ec; --muted:rgba(244,241,236,.6);
  --glass:rgba(255,255,255,var(--alpha)); --glass-2:rgba(255,255,255,.1);
  --stroke:rgba(255,255,255,.14); --input:rgba(0,0,0,.25); --row:rgba(255,255,255,.05);
  --shadow:0 .6rem 2.5rem rgba(0,0,0,.28); --hi:inset 0 1px 0 rgba(255,255,255,.08);
  --grid:rgba(255,255,255,.05); color-scheme:dark;
}
html[data-theme=light]{
  --text:#0f172a; --muted:#64748b;
  --glass:rgba(255,255,255,var(--alpha)); --glass-2:rgba(15,23,42,.06);
  --stroke:rgba(255,255,255,.75); --input:rgba(255,255,255,.7); --row:rgba(255,255,255,.55);
  --shadow:0 .6rem 2.5rem rgba(30,64,175,.1); --hi:inset 0 1px 0 rgba(255,255,255,.9);
  --grid:rgba(15,23,42,.06); color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{font-family:Inter,"Noto Sans TC",system-ui,sans-serif;color:var(--text);background:#111;overflow-x:hidden;min-height:100vh;transition:color .3s}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.no-anim *,.no-anim *::before{animation:none!important;transition:none!important}

/* ================= background ================= */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;transition:background .5s}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:float 18s ease-in-out infinite}
.blob.a{width:28rem;height:28rem;background:var(--accent);top:-6rem;right:8%}
.blob.b{width:22rem;height:22rem;background:var(--accent);opacity:.25;bottom:-5rem;left:22%;animation-delay:-6s}
.bg.img .blob{display:none}
@keyframes float{50%{transform:translate(2rem,-1.5rem) scale(1.06)}}

.glass{
  background:var(--glass);border:1px solid var(--stroke);border-radius:var(--radius);
  backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);
  box-shadow:var(--shadow),var(--hi);
}

/* ================= sidebar ================= */
.side{position:fixed;left:1rem;top:1rem;bottom:1rem;width:13.5rem;padding:1.1rem .8rem;display:flex;flex-direction:column;gap:.3rem;z-index:20;transition:width .25s}
.logo{display:flex;align-items:center;gap:.6rem;padding:.2rem .5rem 1rem;font-weight:700;font-size:1.05rem;white-space:nowrap;overflow:hidden}
.logo .mk{flex:none;width:2.1rem;height:2.1rem;border-radius:.7rem;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:1rem;box-shadow:0 .3rem 1rem color-mix(in srgb,var(--accent) 50%,transparent)}
.side .it{display:flex;align-items:center;gap:.75rem;padding:.65rem .75rem;border-radius:.85rem;border:0;background:transparent;color:var(--muted);font-size:.88rem;white-space:nowrap;overflow:hidden;text-align:left;transition:.2s}
.side .it svg{flex:none;width:1.15rem;height:1.15rem}
.side .it:hover{background:var(--glass-2);color:var(--text)}
.side .it.on{background:var(--accent);color:#fff;box-shadow:0 .3rem 1rem color-mix(in srgb,var(--accent) 45%,transparent)}
.side .sp{flex:1}
body.collapsed .side{width:4.4rem}
body.collapsed .side .lbl,body.collapsed .logo .lbl{opacity:0}
.main{margin-left:15.5rem;padding:1rem 1.4rem 3rem 0;transition:margin .25s}
body.collapsed .main{margin-left:6.4rem}

/* ================= header ================= */
.top{display:flex;align-items:center;gap:.8rem;margin-bottom:1.4rem}
.search{flex:1;max-width:24rem;display:flex;align-items:center;gap:.5rem;padding:.55rem 1rem;border-radius:999px}
.search input{border:0;background:transparent;outline:none;width:100%;font-size:.88rem}
.search svg{width:1rem;height:1rem;color:var(--muted)}
.top .sp{flex:1}
.status{display:flex;align-items:center;gap:.55rem;padding:.5rem .9rem;border-radius:999px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:#888}
.dot.ok{background:#22c55e;box-shadow:0 0 .6rem #22c55e}.dot.warn{background:#fbbf24}.dot.bad{background:#ef4444}
.ib{width:2.5rem;height:2.5rem;border-radius:50%;display:grid;place-items:center;border:1px solid var(--stroke);background:var(--glass);backdrop-filter:blur(var(--blur));color:var(--text)}
.ib svg{width:1.1rem;height:1.1rem}
.ib.on{background:var(--accent);color:#fff;border-color:transparent}
.ib.cur{width:auto;padding:0 .8rem;border-radius:999px;font-size:.78rem;font-weight:700}

.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.hello h1{font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.hello p{color:var(--muted);font-size:.88rem;margin-top:.25rem}
.date{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border-radius:.9rem;font-size:.82rem}
.date b{display:block;font-size:.92rem}

/* ================= module grid ================= */
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:1rem;grid-auto-flow:row dense}
.mod{position:relative;padding:1.2rem;min-width:0;transition:transform .25s,opacity .2s}
.mod[data-size=s]{grid-column:span 4}.mod[data-size=m]{grid-column:span 6}
.mod[data-size=l]{grid-column:span 8}.mod[data-size=xl]{grid-column:span 12}
.mod.bare{padding:0;background:none;border:0;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none}
.mod.hidden{display:none}
.mod.bare .tools{top:-1.1rem}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;margin-bottom:.9rem;flex-wrap:wrap}
.mh h3{font-size:1rem;font-weight:600}
.mh .sub{font-size:.76rem;color:var(--muted);margin-top:.2rem}
.tools{display:none;position:absolute;top:.6rem;right:.6rem;gap:.3rem;z-index:3}
.editing .tools{display:flex}
.editing .mod{outline:2px dashed color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:3px;cursor:grab}
.editing .mod.drag{opacity:.4}
.editing .mod.over{transform:scale(.98);outline-style:solid}
.tools button{border:0;border-radius:.6rem;padding:.3rem .55rem;font-size:.72rem;font-weight:600;background:var(--accent);color:#fff}
.tools button.g{background:rgba(0,0,0,.55)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(13.5rem,1fr));gap:1rem}
.stat{padding:1.1rem 1.1rem .9rem;cursor:pointer;transition:transform .25s}
.stat:hover{transform:translateY(-.25rem)}
.stat .hd{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.cic{width:2.1rem;height:2.1rem;border-radius:.7rem;display:grid;place-items:center;font-size:.68rem;font-weight:700;color:#fff;flex:none}
.stat .val{font-size:1.6rem;font-weight:700;margin-top:.7rem;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .rw{display:flex;justify-content:space-between;align-items:flex-end;margin-top:.3rem;gap:.5rem}
.chg{font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--up)}.down{color:var(--down)}
.spark{width:6.5rem;height:2.2rem;flex:none}
.src{font-size:.66rem;color:var(--muted);margin-top:.35rem}
.fu{animation:fu .8s}.fd{animation:fd .8s}
@keyframes fu{0%{color:var(--up)}}@keyframes fd{0%{color:var(--down)}}

/* chart */
#chart{height:22rem;width:100%}
.pills{display:flex;gap:.35rem;flex-wrap:wrap}
.pill{border:1px solid var(--stroke);background:var(--row);border-radius:999px;padding:.3rem .7rem;font-size:.74rem;color:var(--muted)}
.pill.on{background:var(--accent);border-color:transparent;color:#fff}
.ind{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:.7rem;align-items:center}
.ind label{display:flex;gap:.3rem;align-items:center;cursor:pointer}
.ind i{display:inline-block;width:.8rem;height:.18rem;border-radius:1px}
.rsi{margin-left:auto;font-weight:600}

/* lists */
.list{display:flex;flex-direction:column;gap:.55rem}
.item{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border-radius:var(--rad-sm);background:var(--row);border:1px solid var(--stroke)}
.item .t{font-size:.84rem;font-weight:500}
.item .s{font-size:.72rem;color:var(--muted);margin-top:.12rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .g{flex:1;min-width:0}
.badge{font-size:.68rem;padding:.2rem .5rem;border-radius:999px;background:var(--glass-2);color:var(--muted);white-space:nowrap}
.badge.hit{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}
.x{border:0;background:transparent;color:var(--muted);font-size:1rem;padding:.1rem .4rem;border-radius:.5rem}
.x:hover{background:var(--glass-2);color:var(--text)}
.empty{color:var(--muted);font-size:.8rem;padding:.9rem;text-align:center}

/* forms */
.form{display:grid;gap:.5rem;margin-top:.8rem}
.r{display:flex;gap:.5rem}
.in{width:100%;min-width:0;background:var(--input);border:1px solid var(--stroke);border-radius:calc(var(--rad-sm)*.8);padding:.55rem .7rem;font-size:.82rem;outline:none}
.in:focus{border-color:var(--accent)}
select.in option{background:#1d1916;color:#eee}
html[data-theme=light] select.in option{background:#fff;color:#111}
.btn{white-space:nowrap;border:0;border-radius:calc(var(--rad-sm)*.8);padding:.6rem .9rem;font-size:.84rem;font-weight:600;background:var(--accent);color:#fff;transition:.15s}
.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
.btn.buy{background:var(--up);color:#fff}.btn.sell{background:var(--down);color:#fff}
.btn.ghost{background:var(--glass-2);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.sm{padding:.35rem .7rem;font-size:.74rem}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.84rem}
th{text-align:left;font-weight:500;color:var(--muted);font-size:.72rem;padding:0 .5rem .6rem;white-space:nowrap}
td{padding:.65rem .5rem;border-top:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
tr.ck{cursor:pointer}tr.ck:hover td{background:var(--row)}
.coin{display:flex;align-items:center;gap:.6rem;font-weight:600}
.coin small{display:block;font-size:.68rem;color:var(--muted);font-weight:400}
.nr{text-align:right}
.ts{width:5rem;height:1.6rem}

/* paper / misc */
.pf{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.4rem}
.pf div{padding:.6rem .7rem;border-radius:var(--rad-sm);background:var(--row)}
.pf b{display:block;font-size:.95rem;margin-top:.1rem;font-variant-numeric:tabular-nums}
.pf span{font-size:.7rem;color:var(--muted)}
.donut{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}
.donut svg{width:8.5rem;height:8.5rem;flex:none}
.legend{display:flex;flex-direction:column;gap:.45rem;font-size:.8rem;flex:1;min-width:8rem}
.legend div{display:flex;align-items:center;gap:.5rem}
.legend i{width:.6rem;height:.6rem;border-radius:50%;flex:none}
.legend span{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.gauge{display:flex;flex-direction:column;align-items:center}
.gauge svg{width:100%;max-width:15rem}
.gauge b{font-size:1.7rem;margin-top:.2rem}
.gauge span{font-size:.82rem;color:var(--muted)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.8rem}
.kv div{padding:.55rem .7rem;border-radius:var(--rad-sm);background:var(--row)}
.kv span{display:block;font-size:.68rem;color:var(--muted)}
.kv b{font-size:.92rem;font-variant-numeric:tabular-nums}
.note{font-size:.7rem;color:var(--muted);margin-top:.6rem;line-height:1.5}

/* trading + risk */
.mod{container-type:inline-size}
.pf4{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:1rem}
.pf4 div{padding:.6rem .75rem;border-radius:var(--rad-sm);background:var(--row)}
.pf4 span{font-size:.7rem;color:var(--muted)}.pf4 b{display:block;font-size:1rem;margin-top:.1rem;font-variant-numeric:tabular-nums}
@container (max-width:30rem){.pf4{grid-template-columns:repeat(2,1fr)}}
.tradegrid,.rkgrid{display:grid;gap:1.2rem}
@container (min-width:40rem){.tradegrid{grid-template-columns:minmax(0,22rem) minmax(0,1fr)}.rkgrid{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.ticket{display:grid;gap:.5rem;align-content:start}
.ticket{min-width:0}.ticket>*{min-width:0;max-width:100%}.fbtns{flex-wrap:wrap}.fbtns .btn{flex:1 1 100%;white-space:normal;text-align:center}
.seg.wide{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.seg.wide button{padding:.45rem}
#oSide button[data-v=buy].on{background:var(--up)}#oSide button[data-v=sell].on{background:var(--down)}
.qb{display:flex;gap:.35rem;flex-wrap:wrap}
.qb button{flex:1;border:1px solid var(--stroke);background:var(--row);border-radius:.6rem;padding:.32rem .4rem;font-size:.72rem;color:var(--muted);white-space:nowrap}
.qb button:hover{color:var(--text);border-color:var(--accent)}
.chk{display:flex;gap:.45rem;align-items:flex-start;font-size:.76rem;color:var(--muted);cursor:pointer;line-height:1.4}
.chk input{accent-color:var(--accent);margin-top:.15rem}
.ro{color:var(--muted);display:flex;align-items:center;white-space:nowrap;overflow:hidden}
.lh{font-size:.8rem;font-weight:600;margin-bottom:.5rem}
.rkhead{display:flex;justify-content:space-between;align-items:center}
.rkhead b{display:block;font-size:1.6rem}
.score{display:flex;gap:.3rem;margin:.5rem 0 .6rem}
.score i{flex:1;height:.45rem;border-radius:99px;background:var(--glass-2)}
.fac{display:flex;gap:.7rem;padding:.55rem 0;border-top:1px solid var(--grid);font-size:.8rem}
.fac .pts{color:var(--accent);letter-spacing:.08em;font-size:.7rem;padding-top:.15rem;white-space:nowrap}
.fac .s{font-size:.72rem;color:var(--muted);margin-top:.15rem}
.ckr{display:flex;gap:.55rem;font-size:.78rem;padding:.35rem 0;line-height:1.45}
.ckr span:first-child{font-weight:700}

/* risk control */
.rule{display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.5rem 0;border-top:1px solid var(--grid);font-size:.8rem}
.rule .s{font-size:.7rem;color:var(--muted);margin-top:.1rem}
.rin{display:flex;align-items:center;gap:.3rem;flex:none}.rin input{width:4.6rem;text-align:right;padding:.35rem .5rem}.rin i{font-style:normal;font-size:.72rem;color:var(--muted);width:1rem}
.gbar{padding:.8rem 1rem;border-radius:var(--rad-sm);font-size:.82rem;display:flex;justify-content:space-between;gap:.6rem 1rem;align-items:center;flex-wrap:wrap}
.gbar.ok{background:color-mix(in srgb,#22c55e 12%,transparent);border:1px solid color-mix(in srgb,#22c55e 35%,transparent)}
.gbar.lock{background:color-mix(in srgb,#ef4444 14%,transparent);border:1px solid color-mix(in srgb,#ef4444 45%,transparent)}
.gbar.off{background:var(--row);border:1px dashed var(--stroke);color:var(--muted)}
.gbar .s{font-size:.72rem;color:var(--muted);margin-top:.2rem}
.gstats{display:flex;gap:.4rem 1.1rem;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}.gstats b{color:var(--text)}
.gwrap{display:grid;gap:0 1.5rem}
@container (min-width:40rem){.gwrap{grid-template-columns:1fr 1fr}}
.emg{display:grid;grid-template-columns:1fr 1fr;gap:.45rem}.emg .btn{font-size:.76rem;padding:.55rem .5rem;white-space:normal}
.map{font-size:.74rem;line-height:1.55;color:var(--muted)}.map div{padding:.35rem 0;border-top:1px solid var(--grid)}.map b{color:var(--text)}
.g-off #gRules,.g-off #gPreset{opacity:.45}

/* futures + grid */
details.learn{margin-bottom:.8rem;border:1px solid var(--stroke);border-radius:var(--rad-sm);background:var(--row);padding:.6rem .8rem;font-size:.78rem;line-height:1.6}
details.learn summary{cursor:pointer;font-weight:600}
details.learn div{padding:.3rem 0;color:var(--muted)}details.learn b{color:var(--text)}
.quiz{border:1px solid var(--accent);border-radius:var(--rad-sm);padding:.8rem;margin-bottom:.8rem;font-size:.8rem;display:grid;gap:.5rem}
.quiz .s{font-size:.72rem;color:var(--muted)}
.qq{padding-top:.4rem;border-top:1px solid var(--grid)}.qq label{display:flex;gap:.4rem;padding:.2rem 0;color:var(--muted);cursor:pointer}.qq label input{accent-color:var(--accent)}
.qe{font-size:.74rem;margin-top:.2rem}
.ticket.locked{opacity:.35;pointer-events:none;filter:grayscale(.6)}
#fSide button[data-v=long].on{background:var(--up)}#fSide button[data-v=short].on{background:var(--down)}
.qb button.on{background:var(--accent);color:#fff;border-color:transparent}.qb button:disabled{opacity:.3;cursor:not-allowed}
table.scen{font-size:.76rem}table.scen td,table.scen th{padding:.45rem .4rem}
td.liq{color:#ef4444;font-weight:700}
.gbars{display:flex;gap:2px;margin-top:.35rem}.gbars i{flex:1;height:.35rem;border-radius:2px;background:var(--glass-2)}.gbars i.coin{background:var(--accent)}

/* AI room */
.ai-ctl{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.ai-st{font-size:.76rem;color:var(--muted)}
.aiinit{display:flex;align-items:center;gap:.35rem;font-size:.8rem;color:var(--muted);white-space:nowrap}.aiinit input{width:7.5rem}
.ai-grid{display:grid;gap:1.2rem}
@container (min-width:44rem){.ai-grid{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}}
#aiChart{height:19rem;width:100%}
.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(12rem,1fr));gap:.5rem}
.role{padding:.6rem .7rem;border-radius:var(--rad-sm);background:var(--row);border:1px solid var(--stroke);font-size:.76rem}
.role.ok{border-color:color-mix(in srgb,var(--up) 45%,transparent)}.role.no{border-color:color-mix(in srgb,var(--down) 55%,transparent)}
.role .rh{display:flex;justify-content:space-between;gap:.5rem;font-weight:600}.role.ok .rh b{color:var(--up)}.role.no .rh b{color:var(--down)}
.role .rn{color:var(--muted);margin-top:.25rem;line-height:1.45;font-size:.72rem}
.ai-log{max-height:44rem;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;padding-right:.2rem}
.ai-e{border-radius:var(--rad-sm);background:var(--row);border:1px solid var(--stroke);font-size:.78rem}
.ai-e summary{display:flex;gap:.55rem;align-items:flex-start;padding:.55rem .65rem;cursor:pointer;list-style:none}
.ai-e summary::-webkit-details-marker{display:none}
.ai-e .g{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.ai-e .s{color:var(--muted);font-size:.68rem;margin-left:.4rem}.ai-e .d{color:var(--muted);font-size:.74rem}
.ai-e.BUY{border-left:3px solid var(--up)}.ai-e.SELL{border-left:3px solid var(--down)}.ai-e.SKIP{opacity:.75}
.badge.up{background:color-mix(in srgb,var(--up) 22%,transparent);color:var(--up)}.badge.down{background:color-mix(in srgb,var(--down) 22%,transparent);color:var(--down)}
.ai-r{display:grid;gap:.3rem;padding:0 .65rem .6rem}
.ai-r div{display:grid;grid-template-columns:5.5rem 4.5rem 1fr;gap:.4rem;font-size:.72rem;align-items:start}
.ai-r i{font-style:normal;color:var(--muted)}
.ai-concl{margin-top:.8rem;padding:.8rem;border-radius:var(--rad-sm);border:1px solid var(--accent);font-size:.8rem;line-height:1.6}

/* wallets */
.wgrid{display:grid;gap:1.2rem}
@container (min-width:48rem){.wgrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr)}}
.wlist{display:grid;gap:.5rem}
.wcard{padding:.7rem .85rem;border-radius:var(--rad-sm);background:var(--row);border:1px solid var(--stroke)}

function applyAppearance(){
  const root=document.documentElement, th=themeNow();
  root.dataset.theme=th;
  root.style.setProperty('--accent',C.accent);
  root.style.setProperty('--blur',C.blur+'px');
  root.style.setProperty('--radius',C.radius+'px');
  const a=th==='dark'? .02+C.opacity/100*.33 : .25+C.opacity/100*.65;
  root.style.setProperty('--alpha',a.toFixed(3));
  root.style.setProperty('--up',C.twColor?'#ef4444':(th==='dark'?'#34d399':'#16a34a'));
  root.style.setProperty('--down',C.twColor?(th==='dark'?'#34d399':'#16a34a'):(th==='dark'?'#f87171':'#dc2626'));
  // size: auto = scales with window width; manual = fixed %
  root.style.fontSize=C.autoScale?'clamp(13px, calc(0.42vw + 9.2px), 18px)':(16*C.scale/100)+'px';
  document.body.classList.toggle('no-anim',!C.anim);

}

function buildLayout(){
  const g=$('grid');
  for(const m of C.layout){
    const el=document.createElement('section');
    el.className='mod glass'+(m.id==='stats'?' bare':''); el.dataset.id=m.id; el.id='mod-'+m.id;
    el.innerHTML=`<div class="tools"><button data-act="size" title="調整大小"></button><button class="g" data-act="hide" title="隱藏">隱藏</button></div>`+TPL[m.id]();
    g.appendChild(el);
  }
  applyLayout();
  // edit-mode tools
  g.addEventListener('click',e=>{
    const b=e.target.closest('.tools button'); if(!b) return;
    const id=b.closest('.mod').dataset.id, m=C.layout.find(x=>x.id===id);
    if(b.dataset.act==='size'){const k=Object.keys(SIZES);m.size=k[(k.indexOf(m.size)+1)%k.length]}
    else m.show=false;
    saveC(); applyLayout(); renderSettings();
  });
  // drag & drop reorder
  let dragId=null;
  g.addEventListener('dragstart',e=>{const m=e.target.closest?.('.mod');if(!m||!S.editing)return;dragId=m.dataset.id;m.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch{}});
  g.addEventListener('dragend',()=>{document.querySelectorAll('.mod').forEach(m=>m.classList.remove('drag','over'));dragId=null});
  g.addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const m=e.target.closest('.mod');document.querySelectorAll('.mod.over').forEach(x=>x!==m&&x.classList.remove('over'));m&&m.dataset.id!==dragId&&m.classList.add('over')});
  g.addEventListener('drop',e=>{
    e.preventDefault();const m=e.target.closest('.mod');if(!m||!dragId||m.dataset.id===dragId)return;
    const from=C.layout.findIndex(x=>x.id===dragId),item=C.layout.splice(from,1)[0];
    const to=C.layout.findIndex(x=>x.id===m.dataset.id);
    const r=m.getBoundingClientRect(),after=(e.clientY>r.top+r.height/2)||(e.clientX>r.left+r.width*.66);
    C.layout.splice(after?to+1:to,0,item); saveC(); applyLayout(); renderSettings();
  });
}
function applyLayout(){
  const g=$('grid');
  for(const m of C.layout){
    const el=$('mod-'+m.id); el.dataset.size=m.size; el.classList.toggle('hidden',!m.show); el.classList.toggle('retired',RETIRED.has(m.id));
    el.draggable=S.editing; el.querySelector('[data-act=size]').textContent='大小：'+SIZES[m.size];
    g.appendChild(el);
  }
  renderSide();
}
function setEditing(v){
  S.editing=v; document.body.classList.toggle('editing',v); $('grid').classList.toggle('editing',v);

async function fetchBinanceTickers(list){
  const out={};
  try{
    const j=await getJSON(BN+'/ticker/24hr?symbols='+encodeURIComponent(JSON.stringify(list.map(s=>s+'USDT'))));
    for(const t of j) out[t.symbol.replace(/USDT$/,'')]=t; S.bnOK=true;
  }catch{
    // one bad symbol fails the whole batch → retry individually
    const rs=await Promise.allSettled(list.map(s=>getJSON(`${BN}/ticker/24hr?symbol=${s}USDT`)));
    rs.forEach((r,i)=>{if(r.status==='fulfilled')out[list[i]]=r.value});
    S.bnOK=Object.keys(out).length>0;
  }
  return out;
}
async function fetchPrices(){
  const coins=trackedCoins(), bito={};
  try{const j=await getJSON(BITO+'/tickers');for(const t of(j.data||[]))bito[t.pair.toLowerCase()]=t;S.bitoOK=true}catch{S.bitoOK=false}
  if(bito.usdt_twd){S.rate=+bito.usdt_twd.lastPrice;S.rateSrc='BitoPro'}
  else if(S.rateSrc!=='BitoPro'){
    try{const j=await getJSON('https://api.coingecko.com/api/v3/simple/price?ids=tether&vs_currencies=twd');S.rate=+j.tether.twd;S.rateSrc='CoinGecko'}
    catch{if(!S.rate){S.rate=32;S.rateSrc='估計值'}}
  }
  const need=coins.filter(c=>c!=='USDT'&&!bito[c.toLowerCase()+'_twd']);
  const bn=need.length?await fetchBinanceTickers(need):{};
  for(const c of coins){
    const prev=S.prices[c]?.twd, b=bito[c.toLowerCase()+'_twd']; let p=null;
    if(b) p={twd:+b.lastPrice,chg:+b.priceChange24hr,high:+b.high24hr,low:+b.low24hr,src:'BitoPro'};
    else if(c==='USDT') p={twd:S.rate,chg:0,high:S.rate,low:S.rate,src:S.rateSrc};
    else if(bn[c]){const t=bn[c],r=S.rate;p={twd:+t.lastPrice*r,chg:+t.priceChangePercent,high:+t.highPrice*r,low:+t.lowPrice*r,src:'Binance 換算'}}

const sma=(i,n)=>{if(i<n-1)return null;let s=0;for(let k=i-n+1;k<=i;k++)s+=bars[k].close;return s/n};
function bollAt(i){const m=sma(i,20);if(m==null)return null;let v=0;for(let k=i-19;k<=i;k++)v+=(bars[k].close-m)**2;const sd=Math.sqrt(v/20);return[m+2*sd,m-2*sd]}
function rsi(n=14){
  if(bars.length<n+1) return null; let g=0,l=0;
  for(let i=1;i<=n;i++){const d=bars[i].close-bars[i-1].close;d>0?g+=d:l-=d}
  g/=n;l/=n;
  for(let i=n+1;i<bars.length;i++){const d=bars[i].close-bars[i-1].close;g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n}
  return l===0?100:100-100/(1+g/l);
}

/* ======================================================================
   PAPER TRADING ENGINE — market / limit / stop, OCO brackets, avg-cost PnL
   ====================================================================== */
const newPf=()=>({cash:C.initial,pos:{},orders:[],trades:[],eq:[],dca:[]});
function migratePf(){
  const pf=S.pf;
  if(!pf.pos){
    pf.pos={};
    for(const[c,q]of Object.entries(pf.hold||{})){
      const b=(pf.trades||[]).filter(t=>t.c===c&&t.side==='buy');
      const avg=b.length?b.reduce((a,t)=>a+t.amt,0)/b.reduce((a,t)=>a+t.amt/t.price,0):0;
      pf.pos[c]={qty:q,cost:q*avg};
    }
    delete pf.hold;
  }
  pf.orders=pf.orders||[];pf.trades=pf.trades||[];pf.eq=pf.eq||[];pf.dca=pf.dca||[];
}
const savePf=()=>store.set('pf',S.pf);
const feeR=role=>(role==='maker'?C.feeMaker:C.feeTaker)/100;
const lastP=c=>S.prices[c]?.twd;
const sgn=n=>(n>=0?'+':'')+cur()+fmtN(conv(n),0);
let oid=Date.now();
function reservedQty(c){
  const g={};let q=0;
  for(const o of S.pf.orders) if(o.c===c&&o.side==='sell'){if(o.group)g[o.group]=Math.max(g[o.group]||0,o.qty);else q+=o.qty}
  return q+Object.values(g).reduce((a,b)=>a+b,0);
}
const availQty=c=>Math.max(0,(S.pf.pos[c]?.qty||0)-reservedQty(c));
function pfVal(){let h=0;for(const[c,p]of Object.entries(S.pf.pos))h+=p.qty*(lastP(c)||p.cost/p.qty||0);const res=S.pf.orders.filter(o=>o.side==='buy').reduce((a,o)=>a+o.amt,0);return{hold:h,res,total:S.pf.cash+res+h}}

function execBuy(c,amt,price,role,kind,why,attach){
  const fee=amt*feeR(role),qty=(amt-fee)/price,p=S.pf.pos[c]||(S.pf.pos[c]={qty:0,cost:0});
  p.qty+=qty;p.cost+=amt;
  S.pf.trades.push({side:'buy',c,qty,price,amt,fee,kind,role,why,ts:Date.now()});
  if(attach&&(attach.sl||attach.tp)){
    const g=(attach.sl&&attach.tp)?'g'+(++oid):null;
    if(attach.sl) S.pf.orders.push({id:++oid,c,side:'sell',type:'stop',price:attach.sl,qty,group:g,why:'自動停損',ts:Date.now()});
    if(attach.tp) S.pf.orders.push({id:++oid,c,side:'sell',type:'limit',price:attach.tp,qty,group:g,why:'自動停利',ts:Date.now()});
  }
  return qty;
}
function execSell(c,qty,price,role,kind,why){
  const p=S.pf.pos[c]; if(!p) return 0; qty=Math.min(qty,p.qty); if(qty<=0) return 0;
  const gross=qty*price,fee=gross*feeR(role),net=gross-fee,cost=p.cost/p.qty*qty,pnl=net-cost;
  p.qty-=qty;p.cost-=cost;S.pf.cash+=net;
  if(p.qty*price<0.5){delete S.pf.pos[c];S.pf.orders=S.pf.orders.filter(o=>!(o.c===c&&o.side==='sell'))}
  else for(const o of S.pf.orders) if(o.c===c&&o.side==='sell'&&o.qty>p.qty) o.qty=p.qty;
  S.pf.trades.push({side:'sell',c,qty,price,amt:gross,fee,kind,role,pnl,why,ts:Date.now()});
  return pnl;
}
function checkOrders(){
  let changed=false;const slip=C.slip/100;
  for(const o of [...S.pf.orders]){
    if(!S.pf.orders.includes(o)) continue;
    const p=lastP(o.c); if(!p) continue; let msg=null;
    if(o.side==='buy'&&p<=o.price){execBuy(o.c,o.amt,o.price,'maker','limit',o.why,o.attach);msg=`限價買入 ${o.c} 成交 @ ${fmtN(conv(o.price))}`}
    else if(o.side==='sell'&&o.type==='limit'&&p>=o.price){const r=execSell(o.c,o.qty,o.price,'maker',o.why==='自動停利'?'tp':'limit',o.why);msg=`${o.why==='自動停利'?'停利':'限價賣出'} ${o.c} 成交 @ ${fmtN(conv(o.price))}・損益 ${sgn(r)}`}
    else if(o.side==='sell'&&o.type==='stop'&&p<=o.price){const px=p*(1-slip),r=execSell(o.c,o.qty,px,'taker','stop',o.why);msg=`停損觸發 ${o.c} 賣出 @ ${fmtN(conv(px))}・損益 ${sgn(r)}`}
    if(msg){changed=true;S.pf.orders=S.pf.orders.filter(x=>x!==o&&!(o.group&&x.group===o.group));toast('📌 '+msg);beep()}
  }
  if(changed){savePf();recordEq(true)}
}
function recordEq(force){
  const{total}=pfVal(),eq=S.pf.eq,l=eq[eq.length-1];
  if(!Object.keys(S.prices).length) return;
  if(force||!l||Date.now()-l[0]>10*60e3){eq.push([Date.now(),Math.round(total)]);if(eq.length>3000)eq.splice(0,eq.length-3000);savePf()}
}

const stdev=a=>{const m=a.reduce((x,y)=>x+y,0)/a.length;return Math.sqrt(a.reduce((x,y)=>x+(y-m)**2,0)/(a.length-1))};
function analyze(c){
  const raw=S.daily[c]?.k; if(!raw||raw.length<60) return null;
  const r=S.rate||32;
  const d=raw.map(x=>({h:+x[2]*r,l:+x[3]*r,c:+x[4]*r}));
  const live=lastP(c); if(live) d[d.length-1].c=live;
  const cl=d.map(x=>x.c),n=cl.length,last=cl[n-1];
  const rets=cl.slice(1).map((v,i)=>Math.log(v/cl[i]));
  const vol14=stdev(rets.slice(-14))*Math.sqrt(365),vol90=stdev(rets.slice(-90))*Math.sqrt(365);
  let tr=0;for(let i=n-14;i<n;i++){const{h,l}=d[i],pc=d[i-1].c;tr+=Math.max(h-l,Math.abs(h-pc),Math.abs(l-pc))}
  const atr=tr/14/last;
  const avg=a=>a.reduce((x,y)=>x+y,0)/a.length,ma20=avg(cl.slice(-20)),ma50=avg(cl.slice(-50)),ma20p=avg(cl.slice(-25,-5));
  const trend=last>ma20&&ma20>ma50?'up':last<ma20&&ma20<ma50?'down':'mixed';
  let g=0,l=0;for(let i=1;i<=14;i++){const x=cl[i]-cl[i-1];x>0?g+=x:l-=x}g/=14;l/=14;
  for(let i=15;i<n;i++){const x=cl[i]-cl[i-1];g=(g*13+Math.max(x,0))/14;l=(l*13+Math.max(-x,0))/14}
  const rsiD=l===0?100:100-100/(1+g/l);
  const w=d.slice(-90),hi=Math.max(...w.map(x=>x.h)),lo=Math.min(...w.map(x=>x.l));
  let pk=0,mdd=0;for(const x of w){pk=Math.max(pk,x.c);mdd=Math.max(mdd,(pk-x.c)/pk)}
  return{last,vol14,vol90,atr,ma20,ma50,slope:ma20/ma20p-1,trend,rsi:rsiD,r7:last/cl[n-8]-1,r30:last/cl[n-31]-1,hi,lo,fromHi:last/hi-1,fromLo:last/lo-1,mdd};
}
function riskFactors(c,a){

  P('波動變化',ratio>1.3?2:ratio>1?1:0,`近 14 天 ${(a.vol14*100).toFixed(0)}%・90 天 ${(a.vol90*100).toFixed(0)}%（年化）`,
    ratio>1.3?'最近波動明顯比平常大，停損容易被洗掉':ratio>1?'波動略高於平常':'波動比平常小或持平');

    {up:'價格在兩條均線之上，均線多頭排列',mixed:'均線糾結，方向不明確',down:'價格在均線之下，做多屬於逆勢'}[a.trend]);
  P('RSI(14 日)',a.rsi>75||a.rsi<25?2:a.rsi>70||a.rsi<30?1:0,a.rsi.toFixed(1),

  P('相對 90 天高低點',a.fromHi>-.03?1:a.fromHi<-.3?1:0,`距高點 ${pct(a.fromHi*100)}・距低點 ${pct(a.fromLo*100)}`,

  if(S.fng){const v=+S.fng.value;P('市場情緒',v<=20||v>=80?2:v<=30||v>=70?1:0,`恐懼貪婪 ${v}`,v>=70?'市場偏貪婪，情緒過熱時回檔常較急':v<=30?'市場偏恐懼，波動通常放大':'情緒中性')}
  const pos=S.pf.pos[c];

  }

/* Bybit USDT perpetual specs: min qty / qty step / price tick (USDT) */
const FSPEC={BTC:[0.001,0.001,0.1],ETH:[0.01,0.01,0.01],SOL:[0.1,0.1,0.01],BNB:[0.01,0.01,0.01],XRP:[1,1,0.0001],DOGE:[1,1,0.00001],ADA:[1,1,0.0001]};
function futSpec(c,pxT){const u=pxT&&S.rate?pxT/S.rate:0,d=FSPEC[c];if(d)return{min:d[0],step:d[1],tick:d[2]};
  const tick=u>=1000?0.1:u>=10?0.01:u>=1?0.001:0.00001,st=u>=1000?0.001:u>=10?0.1:1;return{min:st,step:st,tick}}

function futSize(c,val,entry,lev){const sp=futSpec(c,entry),qty=Math.floor(val/entry/sp.step+1e-9)*sp.step,notional=qty*entry;return{qty:+qty.toFixed(8),notional,margin:notional/lev,sp,minVal:sp.min*entry}}

const futEq=(p,px)=>p.margin+futPnl(p,px)-p.funding;
const futLiq=p=>{const m=mmr(),q=p.qty;return p.side==='long'?(p.entry*q-p.margin+p.funding)/(q*(1-m)):(p.margin-p.funding+p.entry*q)/(q*(1+m))};
function futLevels(entry,side,lev,margin){
  const cfg=S.fut.cfg,eqv=(typeof futEquity==='function'?futEquity():S.fut.bal)||S.fut.bal,risk=eqv*(cfg.riskPct??2)/100,notional=margin*lev,fee=cfg.fee/100;
  const liqD=Math.abs(futLiq({side,entry,qty:notional/entry,margin,funding:0})-entry)/entry;

  return{sl,tp,d,loss:notional*(d+2*fee),gain:tp?notional*(d*rr-2*fee):null,note,risk};
}

/* ======================================================================
   GRID BOT SIMULATOR — arithmetic spot grid, own wallet
   ====================================================================== */
S.grid=store.get('grid',null)||{bal:5000,init:5000,bots:[],hist:[]};S.grid.hist=S.grid.hist||[];
const saveGrid=()=>store.set('grid',S.grid);
const GFEE=()=>C.gridFee/100;
function gridLevels(lo,hi,n){const st=(hi-lo)/n;return Array.from({length:n+1},(_,i)=>lo+i*st)}
function gridPlan(c,lo,hi,n,inv,px){
  const L=gridLevels(lo,hi,n),per=inv/n,f=GFEE();
  const slots=[];for(let i=0;i<n;i++){if(L[i]>=px)slots.push({st:'coin',qty:per*(1-f)/px,cost:per});else slots.push({st:'cash',qty:0,cost:0})}
  const coinNow=slots.reduce((a,s)=>a+s.qty,0);
  let qLo=coinNow;for(let i=0;i<n;i++)if(slots[i].st==='cash')qLo+=per*(1-f)/L[i];
  return{L,per,slots,valLo:qLo*lo,valLo2:qLo*lo*.8,stepMin:(hi-lo)/n/hi-2*f,stepMax:(hi-lo)/n/lo-2*f};
}
function gridPreview(){
  const c=$('gdC').value,px=lastP(c);$('gdLast').textContent=px?`現價 ${fmtN(conv(px))}`:'現價 -';
  const lo=num('gdLo'),hi=num('gdHi'),n=Math.round(+$('gdN').value),inv=num('gdInv');
  if(!(px&&lo>0&&hi>lo&&n>=2&&inv>0)){$('gdPrev').innerHTML='填入區間下緣、上緣、格數、投入金額，或按「自動設定」';return}
  const P=gridPlan(c,lo,hi,n,inv,px),inR=px>lo&&px<hi,bad=P.stepMin<=0;
  if(!inR){$('gdPrev').innerHTML=`<div class="note down" style="margin-top:0">⚠ 現價 ${fmtN(conv(px))} 不在 ${fmtN(conv(lo))} ~ ${fmtN(conv(hi))} 區間內。按「自動設定」重新抓區間。</div>`;return}
  $('gdPrev').innerHTML=`<div class="kv" style="margin-top:0">
    <div><span>每格價差</span><b>${cur()}${fmtN(conv((hi-lo)/n))}</b></div>
    <div><span>每格利潤（扣手續費）</span><b class="${bad?'down':''}">${(P.stepMin*100).toFixed(2)}% ~ ${(P.stepMax*100).toFixed(2)}%</b></div>
    <div><span>每格金額</span><b>${cur()}${fmtN(conv(P.per),0)}</b></div>
    <div><span>現在要先買入</span><b>${cur()}${fmtN(conv(P.slots.filter(s=>s.st==='coin').length*P.per),0)}</b></div>
    <div style="grid-column:span 2"><span>跌到下緣 ${fmtN(conv(lo))}：全部變成幣，帳面約</span><b class="down">${cur()}${fmtN(conv(P.valLo),0)}（${pct((P.valLo-inv)/inv*100)}）</b></div>
    <div style="grid-column:span 2"><span>再跌 20%（跌破區間）</span><b class="down">${cur()}${fmtN(conv(P.valLo2),0)}（${pct((P.valLo2-inv)/inv*100)}）</b></div></div>
    ${!inR?'<div class="note down">⚠ 現價不在區間內，網格不會開始交易</div>':''}${bad?'<div class="note down">⚠ 格子太密，每格利潤蓋不過手續費，請減少格數</div>':''}
    <div class="note">漲破上緣：幣全部賣完，之後再漲都賺不到。網格適合「區間震盪」，不適合單邊大漲或大跌。</div>`;
}
function gridAuto(){
  const c=$('gdC').value,px=lastP(c);if(!px)return toast('還沒拿到報價');
  ensureDaily(c).then(()=>{
    const k=S.daily[c]?.k;if(!k)return toast('拿不到歷史資料');
    const r=S.rate||32,w=k.slice(-30);
    let lo=Math.min(...w.map(x=>+x[3]))*r,hi=Math.max(...w.map(x=>+x[2]))*r;
    if(px<=lo||px>=hi){lo=px*.9;hi=px*1.1}
    const dg=px>=1000?0:px>=1?2:6;setNum('gdLo',lo.toFixed(dg));setNum('gdHi',hi.toFixed(dg));
    let n=Math.max(2,Math.min(30,Math.floor((hi-lo)/hi/0.012)));$('gdN').value=n;
    if(!$('gdInv').value)setNum('gdInv',Math.min(2000,Math.floor(S.grid.bal)));
    gridPreview();toast('已用近 30 天高低點設定區間，格數讓每格利潤約 1% 以上');
  });
}
function gridStart(){
  const c=$('gdC').value,px=lastP(c),lo=num('gdLo'),hi=num('gdHi'),n=Math.round(+$('gdN').value),inv=num('gdInv');
  if(!px) return toast('還沒拿到報價');
  if(!(lo>0&&hi>lo)) return toast('上緣要大於下緣');
  if(!(px>lo&&px<hi)) return toast('現價要在區間內');
  if(n<2||n>50) return toast('格數請設 2–50');
  if(!(inv>0)||inv>S.grid.bal) return toast(`網格資金不足（剩 ${cur()}${fmtN(conv(S.grid.bal),0)}）`);
  const P=gridPlan(c,lo,hi,n,inv,px);if(P.stepMin<=0)return toast('格子太密，每格利潤蓋不過手續費');
  S.grid.bal-=inv;S.grid.bots.push({id:Date.now(),c,lo,hi,n,inv,per:P.per,L:P.L,slots:P.slots,profit:0,fills:0,ts:Date.now()});
  saveGrid();renderGrid();toast(`🤖 ${c} 網格啟動：${fmtN(conv(lo))} ~ ${fmtN(conv(hi))}，${n} 格`);
}
function gridVal(b,px){return b.slots.reduce((a,s)=>a+(s.st==='coin'?s.qty*px:b.per),0)+b.profit}
function gridTick(){
  let ch=false;const f=GFEE();
  for(const b of S.grid.bots){const px=lastP(b.c);if(!px)continue;
    for(let i=0;i<b.n;i++){const s=b.slots[i];
      if(s.st==='coin'&&px>=b.L[i+1]){b.profit+=s.qty*b.L[i+1]*(1-f)-s.cost;s.st='cash';s.qty=0;s.cost=0;b.fills++;ch=true}
      else if(s.st==='cash'&&px<=b.L[i]){s.qty=b.per*(1-f)/b.L[i];s.cost=b.per;s.st='coin';b.fills++;ch=true}}}
  if(ch) saveGrid();
}
function gridStop(id){
  const i=S.grid.bots.findIndex(b=>b.id===id);if(i<0)return;const b=S.grid.bots[i],px=lastP(b.c)||b.L[0],f=GFEE();
  const back=b.slots.reduce((a,s)=>a+(s.st==='coin'?s.qty*px*(1-C.slip/100)*(1-f):b.per),0)+b.profit;
  S.grid.bal+=back;S.grid.bots.splice(i,1);S.grid.hist.push({c:b.c,lo:b.lo,hi:b.hi,n:b.n,inv:b.inv,net:back-b.inv,profit:b.profit,fills:b.fills,ts:Date.now(),open:b.ts});
  saveGrid();renderGrid();toast(`網格已停止，結算 ${sgn(back-b.inv)}`);
}
function renderGrid(){
  if(!$('gdBal')) return;const G=S.grid;let run=0,val=0,prof=0;
  for(const b of G.bots){run+=b.inv;val+=gridVal(b,lastP(b.c)||b.L[0]);prof+=b.profit}
  $('gdBal').textContent=cur()+fmtN(conv(G.bal),0);$('gdRun').textContent=cur()+fmtN(conv(run),0);$('gdProf').textContent=sgn(prof);$('gdProf').className=cls(prof);
  const tot=G.bal+val,gb=G.init+(G.xfer||0);$('gdTot').textContent=cur()+fmtN(conv(tot),0)+` (${pct(gb?(tot-gb)/gb*100:0)})`;
  $('gdBots').innerHTML=G.bots.length?G.bots.map(b=>{const px=lastP(b.c)||0,v=gridVal(b,px),out=px<=b.lo?'跌破下緣，暫停中（持有幣）':px>=b.hi?'漲破上緣，暫停中（全是現金）':'';
    const nc=b.slots.filter(s=>s.st==='coin').length;
    return `<div class="item" style="flex-wrap:wrap"><div class="cic" style="background:${meta(b.c).color};width:1.8rem;height:1.8rem;font-size:.58rem">${b.c.slice(0,4)}</div>
      <div class="g"><div class="t">${fmtN(conv(b.lo))} ~ ${fmtN(conv(b.hi))}・${b.n} 格・<span class="${cls(v-b.inv)}">${sgn(v-b.inv)}</span></div>
      <div class="s">網格利潤 ${sgn(b.profit)}・成交 ${b.fills} 次・持幣格 ${nc}/${b.n}${out?`・<span class="down">${out}</span>`:''}</div>
      <div class="gbars">${b.slots.map(s=>`<i class="${s.st}"></i>`).join('')}</div></div>
      <button class="btn ghost sm" data-gstop="${b.id}">停止並結算</button></div>`}).join(''):'<div class="empty">沒有運行中的網格</div>';
  $('gdHist').innerHTML=G.hist.length?G.hist.slice(-4).reverse().map(h=>`<div class="item"><div class="g"><div class="t">${h.c} ${fmtN(conv(h.lo))}~${fmtN(conv(h.hi))}・<span class="${cls(h.net)}">${sgn(h.net)}</span></div><div class="s">網格利潤 ${sgn(h.profit)}・成交 ${h.fills} 次</div></div></div>`).join(''):'<div class="empty">還沒有結束的網格</div>';
  gridPreview();
}

/* ======================================================================

function asSize(c,entry,sl){

function asPlan(A){

function asManage(A,P){

  else{const p=S.fut.pos.find(x=>x.id==t.dataset.fadd);if(!p)return;if(S.fut.bal<100)return toast('合約錢包不足 NT$100');S.fut.bal-=100;p.margin+=100;saveFut();renderFut();toast('已追加 NT$100 保證金，強平價往外移了<br><span style="color:var(--muted)">⚠ 追加保證金只是延後爆倉。方向錯了，該做的是停損，不是加碼凹單</span>')}});
$('fCfgLev').value=S.fut.cfg.maxLev;$('fCfgM').value=S.fut.cfg.maxMarginPct;$('fCfgS').checked=S.fut.cfg.autoStop;
$('fCfgLev').onchange=e=>{const v=+e.target.value;if(v>S.fut.cfg.maxLev&&!e.target.dataset.arm){e.target.dataset.arm=1;e.target.value=S.fut.cfg.maxLev;toast(`要把上限調到 ${v}x？再選一次確認。<br><span style="color:var(--muted)">${v}x 時價格反向約 ${(100/v-0.5).toFixed(1)}% 就爆倉</span>`);setTimeout(()=>delete e.target.dataset.arm,6000);return}
  delete e.target.dataset.arm;S.fut.cfg.maxLev=v;FT.lev=Math.min(FT.lev,v);saveFut();futPreview()};
$('fCfgM').onchange=e=>{S.fut.cfg.maxMarginPct=Math.min(100,Math.max(1,+e.target.value||20));saveFut();futPreview()};
$('fCfgS').onchange=e=>{S.fut.cfg.autoStop=e.target.checked;saveFut();futPreview()};
$('fCfgR').value=S.fut.cfg.riskPct??2;$('fCfgRR').value=S.fut.cfg.autoTP?String(S.fut.cfg.rr||2):'0';
$('fCfgR').onchange=e=>{S.fut.cfg.riskPct=Math.min(10,Math.max(.2,+e.target.value||2));e.target.value=S.fut.cfg.riskPct;saveFut();futPreview()};
$('fCfgRR').onchange=e=>{const v=+e.target.value;S.fut.cfg.autoTP=v>0;if(v>0)S.fut.cfg.rr=v;saveFut();futPreview()};
$('fAuto').onclick=()=>{FT.gamble=false;const c=$('fCoin').value,px=lastP(c);if(!px)return toast('還沒拿到報價');const cfg=S.fut.cfg,lev=Math.min(FT.lev,cfg.maxLev);
  const lim=num('fPrice'),entry=FT.type==='limit'&&lim>0?lim:px,sp=futSpec(c,entry);if(!(num('fMargin')>=sp.min*entry))setNum('fMargin',Math.ceil(sp.min*entry/S.rate*1.02)*S.rate);
  const Z=futSize(c,num('fMargin'),entry,lev),L=futLevels(entry,FT.side,lev,Z.margin);L.sl=fTick(c,L.sl);if(L.tp)L.tp=fTick(c,L.tp);setNum('fSL',L.sl);if(L.tp)setNum('fTP',L.tp);futPreview();
  toast(`⚡ 停損 ${fmtN(conv(L.sl))}・${L.tp?'停利 '+fmtN(conv(L.tp))+'・':''}觸發約虧 ${cur()}${fmtN(conv(L.loss),2)}（帳戶 ${cfg.riskPct}%）${L.note?'<br><span style="color:#f97316">'+L.note+'</span>':''}`)};
$('fReset').onclick=e=>arm(e.target,'再按一次：清空合約錢包',()=>{const u=S.fut.unlocked,cfg=S.fut.cfg;S.fut=structuredClone(FUT_DEF);S.fut.unlocked=u;S.fut.cfg=cfg;saveFut();renderFut()});
['gdLo','gdHi','gdN','gdInv'].forEach(id=>$(id).addEventListener('input',gridPreview));$('gdC').onchange=()=>{['gdLo','gdHi'].forEach(id=>$(id).value='');gridPreview()};
$('gdAuto').onclick=gridAuto;$('gdGo').onclick=gridStart;
$('mod-grid').addEventListener('click',e=>{const t=e.target.closest('[data-gstop]');if(t)arm(t,'再按一次確認',()=>gridStop(+t.dataset.gstop))});
$('gdReset').onclick=e=>{if(S.grid.bots.length)return toast('先停止所有運行中的網格');arm(e.target,'再按一次確認',()=>{S.grid={bal:5000,init:5000,bots:[],hist:[]};saveGrid();renderGrid()})};
renderQuiz();
$('wGo').onclick=walletXfer;
$('rsGo').onclick=e=>{const a=[+$('rsSpot').value,+$('rsFut').value,+$('rsGrid').value];
  if(a.some(v=>!(v>=1)))return toast('三個錢包都要填，每個至少 1');
  if(S.grid.bots.length)return toast('先到網格區停止運行中的網格');
  arm(e.target,'再按一次：全部清空重來',()=>{const[sp,fu,gr]=a.map(toTWD);
    C.initial=Math.round(sp);saveC();S.pf=newPf();savePf();
    const u=S.fut.unlocked,cfg=S.fut.cfg;S.fut=structuredClone(FUT_DEF);S.fut.unlocked=u;S.fut.cfg=cfg;S.fut.bal=S.fut.init=fu;S.fut.orders=[];saveFut();
    S.grid={bal:gr,init:gr,bots:[],hist:[]};saveGrid();S.xlog=[];store.set('xlog',S.xlog);
    ['rsSpot','rsFut','rsGrid'].forEach(id=>$(id).value='');renderPf();toast('✅ 已重設三個錢包')})};$('wDep').onclick=()=>walletExt(1);$('wWd').onclick=()=>walletExt(-1);
$('wSwap').onclick=()=>{const a=$('wFrom').value;$('wFrom').value=$('wTo').value;$('wTo').value=a;renderWallet()};
$('wFrom').onchange=renderWallet;
$('wPct').onclick=e=>{const f=+e.target.dataset.p;if(!f)return;$('wAmt').value=Math.floor(conv(WAL[$('wFrom').value].avail()*f))};
asInit();jInit();
$('cPlan').onclick=()=>{
  const c=$('cCoin').value,p=lastP(c),en=num('cEntry'),st=num('cStop'),tg=num('cTarget'),cap=num('cCap'),rk=+$('cRisk').value;
  if(!(p&&en>0&&st>0&&st<en&&cap>0&&rk>0))return toast('先把計算機填完整（做多時停損要低於進場價）');
  const pos=Math.min(cap*rk/100/((en-st)/en),cap,S.pf.cash);
  F.side='buy';F.type=Math.abs(en-p)/p<.002?'market':'limit';$('oCoin').value=c;setNum('oPrice',F.type==='limit'?en:'');
  setNum('oAmt',Math.floor(pos));$('oBr').checked=true;setNum('oSL',st);setNum('oTP',tg>0?tg:'');
  if(!$('oWhy').value)$('oWhy').value=`計算機計畫：風險 ${rk}%，停損 ${fmtN(conv(st))}`;
  renderTicket();$('mod-paper').scrollIntoView({behavior:'smooth',block:'center'});
  toast(`已把計畫填進下單區${pos<cap*rk/100/((en-st)/en)?'（現金不足，已調成可用金額）':''}，確認後按送出`);
};
['cCap','cRisk','cEntry','cStop','cTarget'].forEach(id=>$(id).addEventListener('input',renderCalc));
setNum('cCap',C.initial);$('cRisk').value=2;
$('cFill').onclick=()=>{const p=S.prices[$('cCoin').value]?.twd;if(!p)return toast('還沒拿到報價，稍等一下');const r=p>=1000?0:p>=1?2:6;setNum('cEntry',p.toFixed(r));setNum('cStop',(p*.97).toFixed(r));renderCalc()};
renderPrices(); renderFng();
fetchPrices().then(()=>{loadChart();loadRisk(S.chartCoin)});renderTicket(); fetchSparks(); fetchFng();
startPolling(); setInterval(fetchSparks,300000); setInterval(fetchFng,3600000);
</script>
</body>
